name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff
        working-directory: ./speech-core
        run: ruff check .

  python-type-check:
    name: Python Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./speech-core
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install mypy

      - name: Run mypy
        working-directory: ./speech-core
        run: mypy speech_core --ignore-missing-imports

  python-test:
    name: Python Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [python-lint, python-type-check]
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./speech-core
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest pytest-asyncio

      - name: Run tests
        working-directory: ./speech-core
        run: |
          # Skip tests that require model files or GPU
          pytest tests/ -v \
            --ignore=tests/test_integration.py \
            -k "not gpu and not integration"

  typescript-lint:
    name: TypeScript Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ESLint
        working-directory: ./gateway-plugins/discord-voice
        run: npm install eslint

      - name: Run ESLint
        working-directory: ./gateway-plugins/discord-voice
        run: npx eslint src/

      - name: Install ESLint (speech-core plugin)
        working-directory: ./gateway-plugins/speech-core
        run: npm install eslint

      - name: Run ESLint (speech-core)
        working-directory: ./gateway-plugins/speech-core
        run: npx eslint src/

  typescript-build:
    name: TypeScript Build
    runs-on: ubuntu-latest
    needs: [typescript-lint]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (discord-voice)
        working-directory: ./gateway-plugins/discord-voice
        run: npm ci

      - name: Build (discord-voice)
        working-directory: ./gateway-plugins/discord-voice
        run: npm run build

      - name: Install dependencies (speech-core)
        working-directory: ./gateway-plugins/speech-core
        run: npm ci

      - name: Build (speech-core)
        working-directory: ./gateway-plugins/speech-core
        run: npm run build
